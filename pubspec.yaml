name: calorie_counter
description: Ember - an offline calorie tracker.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  fl_chart: 0.68.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0F1424"
  adaptive_icon_foreground: "assets/icon_fg.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
